<!-- Place your resume.pdf in the same folder as this file -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Resume — Your Name</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  body{
    font-family: 'Inter', sans-serif;
    background: #0A0F1A;
    color: #E7ECF3;
    min-height: 100vh;
  }
  .heading{
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(90deg, #FF4D8D, #FF7A45);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .rainbow-line{
    height: 3px;
    border-radius: 999px;
    background: linear-gradient(90deg, #FF4D8D, #FFC542, #34D399, #38BDF8, #A78BFA);
  }
  .card-glow{
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 30px 60px -25px rgba(255,77,141,0.25);
  }
  .download-btn{
    background: linear-gradient(90deg, #FF4D8D, #B347F5);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .download-btn:hover{
    transform: translateY(-3px);
    box-shadow: 0 15px 30px -10px rgba(255,77,141,0.5);
  }
  @keyframes floatIn{
    from{ opacity:0; transform: translateY(20px); }
    to{ opacity:1; transform: translateY(0); }
  }
  .float-in{ animation: floatIn .7s ease forwards; }
</style>
</head>

<body class="flex flex-col items-center px-4 sm:px-8 py-16">

  <!-- Heading -->
  <div class="text-center max-w-2xl float-in">
    <h1 class="heading font-extrabold text-4xl sm:text-5xl mb-4">My Resume</h1>
    <p class="text-slate-400 text-sm sm:text-base">
      Here you can view and download my professional resume.
    </p>
  </div>

  <!-- Card -->
  <div class="mt-12 w-full max-w-3xl bg-white text-slate-800 rounded-2xl card-glow p-6 sm:p-10 float-in" style="animation-delay:.15s;">

    <!-- Header block inside card -->
    <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-4 pb-6 border-b border-slate-200">
      <div>
        <h2 class="text-2xl font-bold text-indigo-700">Your Name</h2>
        <p class="text-sm text-slate-500 mt-1">Data Analyst · Python · SQL · Power BI</p>
      </div>
      <div class="text-sm text-slate-600 sm:text-right leading-relaxed">
        <p>Mobile: <span class="font-medium">+91 00000-00000</span></p>
        <p>Email: <a href="mailto:your.email@example.com" class="text-indigo-600 font-medium">your.email@example.com</a></p>
        <p>
          <a href="#" class="text-indigo-600 font-medium">LinkedIn</a> |
          <a href="#" class="text-indigo-600 font-medium">GitHub</a> |
          <a href="#" class="text-indigo-600 font-medium">Portfolio</a>
        </p>
      </div>
    </div>

    <div class="rainbow-line my-6"></div>

    <!-- Embedded resume -->
    <div class="rounded-xl overflow-hidden border border-slate-200">
      <object data="resume.pdf" type="application/pdf" class="w-full" style="height: 750px;">
        <iframe src="resume.pdf" class="w-full" style="height: 750px; border:0;" title="Resume PDF Viewer">
          <p class="p-8 text-center text-slate-500">
            Your browser can't display the embedded PDF.
            <br/>
            <a href="resume.pdf" download class="text-indigo-600 font-semibold underline">Click here to download the resume</a>.
          </p>
        </iframe>
      </object>
    </div>

    <p class="text-xs text-slate-400 mt-4 text-center">
      Trouble viewing it? <a href="resume.pdf" download class="text-indigo-600 underline">Download it directly</a>.
    </p>
  </div>

  <!-- Download button -->
  <a href="resume.pdf" download
     class="download-btn mt-10 inline-flex items-center gap-2 text-white font-semibold text-sm sm:text-base px-8 py-3.5 rounded-full float-in"
     style="animation-delay:.3s;">
    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v12m0 0l-4-4m4 4l4-4M4 20h16"/>
    </svg>
    Download Resume
  </a>

</body>
</html>
